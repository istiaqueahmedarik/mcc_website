name: Contributor scorecard and assignment policy
on:
  issues:
    types: [opened, assigned, unassigned, labeled, unlabeled, closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [master]
    paths:
      - '.github/contribution-policy.json'
      - '.github/workflows/contributor-policy.yml'
      - 'scripts/contributor-policy.mjs'
permissions:
  contents: read
  issues: write
concurrency:
  group: mcc-contributor-policy
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'istiaqueahmedarik/mcc_website'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.x'
      - run: node --test scripts/contributor-policy.test.mjs
      - run: node scripts/contributor-policy.mjs --apply
        env:
          GH_TOKEN: ${{ github.token }}
