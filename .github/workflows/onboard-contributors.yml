name: Onboard approved contributors
on:
  push:
    branches: [master]
    paths:
      - '.github/contribution-policy.json'
      - '.github/onboarding/**'
      - '.github/workflows/onboard-contributors.yml'
      - 'scripts/onboard-members*'
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      member:
        description: 'Approved roster username; leave empty to reconcile new members only'
        required: false
        type: string
      mentor:
        description: 'Approved mentor username; defaults to repository owner'
        required: false
        type: string
permissions:
  contents: read
  issues: write
concurrency:
  group: mcc-member-onboarding
  cancel-in-progress: false
jobs:
  onboard:
    if: github.repository == 'istiaqueahmedarik/mcc_website'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.x'
      - run: node --test scripts/onboard-members.test.mjs scripts/contributor-policy.test.mjs
      - run: node scripts/onboard-members.mjs --apply
        env:
          GH_TOKEN: ${{ github.token }}
          ONBOARD_MEMBER: ${{ inputs.member }}
          ONBOARD_MENTOR: ${{ inputs.mentor }}
