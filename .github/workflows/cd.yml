name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:   # re-run a deploy manually from the Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: false   # queue deploys; never kill one halfway through

permissions:
  contents: read

jobs:
  deploy:
    # Deploy only if CI passed on a push to master (never for PR runs),
    # or when triggered manually.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: self-hosted
    # build + up --wait (180s) + possible rollback --wait (180s) + headroom
    timeout-minutes: 30
    environment: production

    steps:
      - name: Run deploy script
        run: /home/mcc/mcc_website/deploy.sh
        shell: bash