name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]   # re-verify the merged commit; CD waits on this

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v5

      # Make the NEXT_PUBLIC_* values from ci_env.txt available to `next build`
      - name: Load build env from ci_env.txt
        working-directory: .
        run: cat ci_env.txt >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      # - run: npm run lint
      # - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x   # match your server image

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('server/bun.lock*') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      # - run: bun run lint
      # - run: bun test
      # - run: bunx tsc --noEmit

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [client, server]
    steps:
      - uses: actions/checkout@v5

      # docker-compose.yml has `env_file: .env` and ${VAR} build args
      - name: Create .env from ci_env.txt
        run: cp ci_env.txt .env

      - name: Verify compose variables are all set
        run: |
          # Compose only warns on unset variables; turn that into a failure
          if docker compose config 2>&1 >/dev/null | grep -i "not set"; then
            echo "::error::Variables used by docker-compose.yml are missing from ci_env.txt"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build
        env:
          DOCKER_BUILDKIT: 1