services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
        NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL}
        NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL}
        NEXT_PUBLIC_LINKEDIN_URL: ${NEXT_PUBLIC_LINKEDIN_URL}
        NEXT_PUBLIC_DISCORD_URL: ${NEXT_PUBLIC_DISCORD_URL}
        NEXT_PUBLIC_DEBUG_PROFILE_BATCH: ${NEXT_PUBLIC_DEBUG_PROFILE_BATCH}
        SUPABASE_URL: ${SUPABASE_URL}
        HOST_NAME: ${HOST_NAME}
    image: mcc-frontend:latest
    container_name: mcc-frontend
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
    env_file:
      - .env
    ports:
      - "3000:3000"
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mcc-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: mcc-backend:latest
    container_name: mcc-backend
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      TZ: "Asia/Dhaka"
    ports:
      - "5000:5000"
    expose:
      - "5000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "bun -e 'fetch(\"http://127.0.0.1:5000/getContests\").then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mcc-network

  bot:
    image: mcc-backend:latest
    container_name: mcc-bot
    init: true
    # on-failure (not unless-stopped): the bot exits 0 when DISCORD_INTEGRATION_ENABLED
    # is false. With unless-stopped, that clean exit would restart-loop forever.
    restart: on-failure
    command: ["bun", "run", "discord:worker"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: "Asia/Dhaka"
    # No HTTP port, no healthcheck. Bot talks to Discord + DB directly.
    depends_on:
      - backend
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mcc-network

networks:
  mcc-network:
    driver: bridge
